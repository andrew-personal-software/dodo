name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: dev
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: psql postgres://postgres:dev@127.0.0.1:55432/postgres -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm'
      - run: pnpm typecheck
      - run: pnpm test

  # Release, then deploy on the mini PC: github.com/andrew-personal-software/hawk
  hawk:
    needs: test
    uses: andrew-personal-software/hawk/.github/workflows/release.yml@main
    permissions:
      contents: write
    with:
      app: dodo
