name: pr

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  # Conventional-commit title, and the task key at its end (if any) must exist in sparrow.
  title:
    uses: andrew-personal-software/hawk/.github/workflows/pr-title.yml@main

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: dev
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: psql postgres://postgres:dev@127.0.0.1:55432/postgres -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm'
      - run: pnpm typecheck
      - run: pnpm test
